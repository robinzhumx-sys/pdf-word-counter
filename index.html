<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF 字數統計器</title>

  <!-- PDF.js：用於在瀏覽器中讀取 PDF 文字 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: grid;
      place-items: center;
      background: #f3f6fb;
      color: #1f2937;
      font-family: Arial, "Microsoft JhengHei", "PingFang TC", sans-serif;
    }

    .card {
      width: min(760px, 100%);
      padding: 32px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.12);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 28px;
    }

    .hint {
      line-height: 1.7;
      color: #64748b;
    }

    input[type="file"] {
      width: 100%;
      margin: 20px 0 14px;
      padding: 14px;
      border: 2px dashed #94a3b8;
      border-radius: 10px;
      background: #f8fafc;
      cursor: pointer;
    }

    button {
      padding: 12px 20px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    #status {
      min-height: 24px;
      margin: 18px 0;
      color: #475569;
    }

    .results {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 18px;
    }

    .item {
      padding: 16px;
      border-radius: 10px;
      background: #eff6ff;
    }

    .label {
      color: #475569;
      font-size: 14px;
    }

    .number {
      margin-top: 6px;
      color: #1d4ed8;
      font-size: 28px;
      font-weight: bold;
    }

    .note {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      background: #f8fafc;
      color: #475569;
      font-size: 14px;
      line-height: 1.7;
    }

    .warning {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      background: #fffbeb;
      color: #92400e;
      line-height: 1.6;
    }

    h3 {
      margin-top: 24px;
      margin-bottom: 10px;
    }

    #preview {
      width: 100%;
      min-height: 180px;
      padding: 12px;
      resize: vertical;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.6;
    }

    @media (max-width: 550px) {
      .card {
        padding: 22px;
      }

      .results {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>PDF 字數統計器</h1>

    <p class="hint">
      選擇 PDF 後，系統會直接在你的瀏覽器讀取及統計文字。<br>
      PDF 不會上傳到伺服器。適用於可反白及複製文字的 PDF。
    </p>

    <input id="pdfFile" type="file" accept=".pdf,application/pdf" />

    <button id="countBtn">開始統計</button>

    <p id="status">請先選擇一個 PDF 檔案。</p>

    <section class="results">
      <div class="item">
        <div class="label">PDF 頁數</div>
        <div class="number" id="pages">-</div>
      </div>

      <div class="item">
        <div class="label">中文／日文／韓文字元</div>
        <div class="number" id="cjkChars">-</div>
      </div>

      <div class="item">
        <div class="label">英文／數字單字</div>
        <div class="number" id="englishWords">-</div>
      </div>

      <div class="item">
        <div class="label">全部非空白字元</div>
        <div class="number" id="allChars">-</div>
      </div>
    </section>

    <div class="note">
      「英文／數字單字」會把 <strong>2026</strong>、<strong>30</strong>、
      <strong>Company</strong>、<strong>non-executive</strong> 等各計算為一個單字。
      因此結果會較接近 Microsoft Word 的英文文件字數。
    </div>

    <div id="warning" class="warning"></div>

    <h3>擷取到的文字預覽</h3>

    <textarea
      id="preview"
      readonly
      placeholder="完成統計後，這裡會顯示 PDF 前部分文字。"
    ></textarea>
  </main>

  <script>
    // 設定 PDF.js 的 Worker 檔案位置
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    const fileInput = document.getElementById("pdfFile");
    const countBtn = document.getElementById("countBtn");
    const status = document.getElementById("status");
    const warning = document.getElementById("warning");
    const preview = document.getElementById("preview");

    /*
      統計規則：

      1. cjk：
         中文、日文、韓文每個字元算 1。

      2. english：
         英文字母與數字組成的內容算 1 個單字。
         例如：
         Company = 1
         2026 = 1
         PDF2026 = 1
         non-executive = 1
         don't = 1

      3. allChars：
         所有非空白字元都計算，包括標點符號。
    */
    function countText(text) {
      const cjk = (
        text.match(/[\u3400-\u9FFF\uF900-\uFAFF\u3040-\u30FF\uAC00-\uD7AF]/g) || []
      ).length;

      const english = (
        text.match(/[A-Za-z0-9]+(?:['’-][A-Za-z0-9]+)*/g) || []
      ).length;

      const allChars = (text.match(/\S/g) || []).length;

      return {
        cjk,
        english,
        allChars
      };
    }

    countBtn.addEventListener("click", async () => {
      const file = fileInput.files[0];

      if (!file) {
        status.textContent = "請先選擇一個 PDF 檔案。";
        return;
      }

      if (file.type !== "application/pdf" && !file.name.toLowerCase().endsWith(".pdf")) {
        status.textContent = "請選擇 PDF 檔案。";
        return;
      }

      countBtn.disabled = true;
      warning.style.display = "none";
      preview.value = "";
      status.textContent = "正在讀取 PDF…";

      document.getElementById("pages").textContent = "-";
      document.getElementById("cjkChars").textContent = "-";
      document.getElementById("englishWords").textContent = "-";
      document.getElementById("allChars").textContent = "-";

      try {
        const buffer = await file.arrayBuffer();

        const pdf = await pdfjsLib.getDocument({
          data: buffer
        }).promise;

        let fullText = "";

        for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
          status.textContent =
            `正在讀取第 ${pageNumber} / ${pdf.numPages} 頁…`;

          const page = await pdf.getPage(pageNumber);
          const content = await page.getTextContent();

          /*
            PDF.js 將文字拆成很多項目。
            這裡以空格連接，避免相鄰文字黏在一起，
            影響英文或數字的單字統計。
          */
          const pageText = content.items
            .map(item => item.str)
            .join(" ");

          fullText += pageText + "\n";
        }

        const result = countText(fullText);

        document.getElementById("pages").textContent =
          pdf.numPages.toLocaleString();

        document.getElementById("cjkChars").textContent =
          result.cjk.toLocaleString();

        document.getElementById("englishWords").textContent =
          result.english.toLocaleString();

        document.getElementById("allChars").textContent =
          result.allChars.toLocaleString();

        preview.value = fullText.slice(0, 5000);

        if (fullText.trim().length === 0) {
          warning.textContent =
            "這份 PDF 無法直接擷取文字，可能是掃描檔或圖片 PDF。請先使用 OCR 將 PDF 轉換成可搜尋文字後再統計。";

          warning.style.display = "block";
          status.textContent = "完成，但 PDF 中沒有可擷取的文字。";
        } else {
          status.textContent =
            "統計完成。你的 PDF 沒有被上傳到任何伺服器。";
        }
      } catch (error) {
        console.error(error);

        status.textContent =
          "讀取失敗。請確認檔案是有效 PDF，或嘗試以較小的 PDF 測試。";
      } finally {
        countBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
