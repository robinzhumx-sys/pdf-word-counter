<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF 字數統計器</title>

  <!-- PDF.js：讀取 PDF 文字 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: grid;
      place-items: center;
      font-family: Arial, "Microsoft JhengHei", "PingFang TC", sans-serif;
      background: #f3f6fb;
      color: #1f2937;
    }

    .card {
      width: min(760px, 100%);
      padding: 32px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.12);
    }

    h1 {
      margin: 0 0 12px;
      color: #1d4ed8;
    }

    h3 {
      margin-top: 28px;
    }

    .hint {
      color: #64748b;
      line-height: 1.7;
    }

    input[type="file"] {
      display: block;
      width: 100%;
      margin: 20px 0 14px;
      padding: 14px;
      border: 2px dashed #94a3b8;
      border-radius: 10px;
      background: #f8fafc;
      cursor: pointer;
    }

    button {
      padding: 12px 20px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: #ffffff;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    #status {
      min-height: 24px;
      margin: 18px 0;
      color: #475569;
    }

    .results {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 20px;
    }

    .item {
      padding: 16px;
      border-radius: 10px;
      background: #eff6ff;
    }

    .label {
      color: #475569;
      font-size: 14px;
    }

    .number {
      margin-top: 6px;
      color: #1d4ed8;
      font-size: 28px;
      font-weight: bold;
    }

    #warning {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      background: #fffbeb;
      color: #92400e;
      line-height: 1.6;
    }

    #preview {
      width: 100%;
      min-height: 180px;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      resize: vertical;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.6;
    }

    @media (max-width: 520px) {
      .card {
        padding: 22px;
      }

      .results {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>PDF 字數統計器</h1>

    <p
