<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF 字數統計器</title>

  <!-- PDF.js：在瀏覽器讀取 PDF 文字 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #f3f6fb;
      color: #1f2937;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(720px, 100%);
      background: white;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 10px 28px rgba(0,0,0,.12);
    }

    h1 { margin-top: 0; }
    .hint { color: #6b7280; line-height: 1.7; }

    input[type="file"] {
      width: 100%;
      margin: 18px 0;
      padding: 14px;
      border: 2px dashed #94a3b8;
      border-radius: 10px;
      background: #f8fafc;
    }

    button {
      background: #2563eb;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover { background: #1d4ed8; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }

    #status {
      margin: 18px 0;
      color: #475569;
    }

    .results {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 20px;
    }

    .item {
      background: #eff6ff;
      border-radius: 10px;
      padding: 16px;
    }

    .label {
      color: #475569;
      font-size: 14px;
    }

    .number {
      margin-top: 6px;
      font-size: 28px;
      font-weight: bold;
      color: #1d4ed8;
    }

    #preview {
      margin-top: 20px;
      width: 100%;
      min-height: 150px;
      resize: vertical;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-family: inherit;
    }

    .warning {
      margin-top: 16px;
      color: #92400e;
      background: #fffbeb;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>PDF 字數統計器</h1>

    <p class="hint">
      選擇 PDF 後，系統會在你的瀏覽器內讀取文字及統計。<br>
      適用於可選取文字的 PDF；掃描 PDF 可能讀不到內容。
    </p>

    <input id="pdfFile" type="file" accept="application/pdf,.pdf" />
    <button id="countBtn">開始統計</button>

    <p id="status">請先選擇 PDF。</p>

    <section class="results">
      <div class="item">
        <div class="label">PDF 頁數</div>
        <div class="number" id="pages">-</div>
      </div>

      <div class="item">
        <div class="label">中文／日文／韓文字元</div>
        <div class="number" id="cjkChars">-</div>
      </div>

      <div class="item">
        <div class="label">英文／數字單字</div>
        <div class="number" id="englishWords">-</div>
      </div>

      <div class="item">
        <div class="label">全部非空白字元</div>
        <div class="number" id="allChars">-</div>
      </div>
    </section>

    <div id="warning" class="warning"></div>

    <h3>擷取到的文字預覽</h3>
    <textarea id="preview" readonly placeholder="統計完成後，這裡會顯示部分文字。"></textarea>
  </main>

  <script>
    // 指定 PDF.js Worker
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    const fileInput = document.getElementById("pdfFile");
    const countBtn = document.getElementById("countBtn");
    const status = document.getElementById("status");
    const warning = document.getElementById("warning");
    const preview = document.getElementById("preview");

    function countText(text) {
      // 中、日、韓文字元
      const cjk = (text.match(/[\u3400-\u9FFF\uF900-\uFAFF\u3040-\u30FF\uAC00-\uD7AF]/g) || []).length;

      // 英文／數字單字：例如 hello、don't、PDF-file
      const english = (text.match(/[A-Za-z0-9]+(?:['’-][A-Za-z0-9]+)*/g) || []).length;

      // 所有非空白字元
      const allChars = (text.match(/\S/g) || []).length;

      return { cjk, english, allChars };
    }

    countBtn.addEventListener("click", async () => {
      const file = fileInput.files[0];

      if (!file) {
        status.textContent = "請先選擇一個 PDF 檔案。";
        return;
      }

      warning.style.display = "none";
      preview.value = "";
      countBtn.disabled = true;
      status.textContent = "正在讀取 PDF…";

      try {
        const buffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;

        let fullText = "";

        for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
          status.textContent = `正在讀取第 ${pageNumber} / ${pdf.numPages} 頁…`;

          const page = await pdf.getPage(pageNumber);
          const content = await page.getTextContent();

          const pageText = content.items
            .map(item => item.str)
            .join(" ");

          fullText += pageText + "\n";
        }

        const result = countText(fullText);

        document.getElementById("pages").textContent = pdf.numPages.toLocaleString();
        document.getElementById("cjkChars").textContent = result.cjk.toLocaleString();
        document.getElementById("englishWords").textContent = result.english.toLocaleString();
        document.getElementById("allChars").textContent = result.allChars.toLocaleString();

        preview.value = fullText.slice(0, 5000);

        if (fullText.trim().length === 0) {
          warning.textContent =
            "這份 PDF 沒有可直接擷取的文字，可能是掃描檔或圖片 PDF；需要先使用 OCR。";
          warning.style.display = "block";
          status.textContent = "完成，但未能擷取文字。";
        } else {
          status.textContent = "統計完成。PDF 不會被上傳到伺服器。";
        }

      } catch (error) {
        console.error(error);
        status.textContent = "讀取失敗：請確認檔案是有效 PDF，或改用較小的檔案測試。";
      } finally {
        countBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
